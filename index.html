<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>freshhands — freelancers for small jobs</title>
<meta name="description" content="Hire a freelancer for design, video edits, websites, translations and more. Talk to them directly. 0% commission.">
<meta property="og:title" content="freshhands — freelancers for small jobs">
<meta property="og:description" content="Hire a freelancer. Get it done this week. 0% commission.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Cpath d='M9 24V8h13v4h-8.5v3H21v4h-7.5v5z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --paper:#ffffff;
    --ink:#121212;
    --muted:#6a6862;
    --line:#e2dfd7;
    --line-2:#cdc9bf;
    --hot:#1f5f4a;
    --hot-ink:#ffffff;
    --sans:"Instrument Sans", system-ui, sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
    --mono:"Instrument Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);overflow-x:hidden;min-height:100vh}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--hot);outline-offset:3px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

  /* header */
  header{border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--bg);z-index:10}
  .bar{display:flex;align-items:center;gap:20px;height:60px}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;display:flex;align-items:center;gap:8px}
  .logo i{width:12px;height:12px;background:var(--hot);display:inline-block;border-radius:50%}
  nav{margin-left:auto;display:flex;gap:18px;align-items:center}
  nav a{text-decoration:none;font-size:15px}
  nav a:hover{color:var(--hot)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out,color .15s ease-out;border-radius:999px;-webkit-tap-highlight-color:transparent}
  .btn:hover{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.hot{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
  .btn.hot:hover{background:var(--ink);border-color:var(--ink)}
  .btn[aria-disabled=true]{opacity:.45;pointer-events:none}
  nav .btn{padding:9px 16px;font-size:14px}
  @media (max-width:560px){ nav .hide-s{display:none} }

  /* hero */
  .hero{padding-top:48px;padding-bottom:28px}
  .hero h1{font-weight:800;font-size:clamp(46px,10.5vw,120px);line-height:.9;letter-spacing:-.05em;max-width:11ch}
  .hero h1 span{color:var(--hot)}
  .hero .sub{display:grid;gap:20px;margin-top:28px;align-items:end}
  .hero p{max-width:46ch;font-size:18px;color:var(--muted)}
  .stats{display:flex;gap:24px;flex-wrap:wrap}
  .stats b{display:block;font:800 28px/1 var(--sans);letter-spacing:-.03em;color:var(--ink)}
  @media (min-width:860px){ .hero .sub{grid-template-columns:1fr auto} }

  /* search + categories */
  .search{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding:8px 0;margin-top:36px}
  .search input{flex:1;min-width:0;border:0;background:transparent;font:500 22px/1.2 var(--sans);letter-spacing:-.01em;padding:8px 0;color:var(--ink);outline:none}
  .search input::placeholder{color:#a8a397}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out;-webkit-tap-highlight-color:transparent}
  .chip:hover{background:var(--ink);color:var(--bg)}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .chip small{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:4px}

  /* featured */
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:44px 0 12px}
  .sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .featured{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .feat{background:var(--ink);color:var(--bg);padding:22px;text-decoration:none;display:flex;flex-direction:column;gap:14px;min-height:220px;border-radius:4px;transition:transform .15s ease-out}
  .feat:hover{transform:translateY(-3px)}
  .feat .who{display:flex;align-items:center;gap:12px}
  .feat h3{font-size:24px;line-height:1.1;letter-spacing:-.03em;font-weight:700}
  .feat .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#b9b4a8}
  .feat .foot b{color:var(--hot);font-size:15px}

  /* list */
  .list{border-top:1px solid var(--ink)}
  .row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:background .12s ease-out}
  .row:hover{background:#ebe8de}
  .row .t{min-width:0}
  .row .n{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .d{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .p{text-align:right;font-weight:700;white-space:nowrap}
  .row .p small{display:block;font:400 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  @media (min-width:860px){ .row{grid-template-columns:44px 1.1fr 1fr 140px 110px} .row .cat,.row .rep{display:block} }
  .row .cat,.row .rep{display:none;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;letter-spacing:-.02em}
  .av.big{width:84px;height:84px;font-size:32px}
  .badge{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid currentColor}
  .badge.pro{color:var(--ink)}
  .badge.ultra{background:var(--hot);border-color:var(--hot);color:#fff}

  .empty{padding:40px 0;color:var(--muted);border-bottom:1px solid var(--line)}
  .empty a{color:var(--ink);font-weight:700}

  /* ad slot */
  .ad{margin:16px 0;padding:14px 16px;border:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);min-height:90px}
  .ad .mono{font-size:10px}
  .ad a{color:var(--ink);font-weight:700}

  /* join band */
  .band{margin-top:64px;padding-top:40px;padding-bottom:40px;border-top:1px solid var(--ink);display:grid;gap:20px}
  .band h2{font-size:clamp(32px,6vw,56px);line-height:1;letter-spacing:-.04em;font-weight:800;max-width:16ch}
  @media (min-width:860px){ .band{grid-template-columns:1fr auto;align-items:end} }

  /* profile */
  .back{display:inline-block;margin:24px 0 8px;text-decoration:none;color:var(--muted)}
  .back:hover{color:var(--ink)}
  .prof{display:grid;gap:32px;padding-bottom:24px}
  @media (min-width:860px){ .prof{grid-template-columns:1fr 340px;gap:64px} .side{position:sticky;top:84px;align-self:start} }
  .prof h1{font-size:clamp(36px,7vw,64px);line-height:.98;letter-spacing:-.045em;font-weight:800;margin:18px 0 14px}
  .prof .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted)}
  .prof .about{font-size:18px;max-width:60ch;margin-top:20px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
  .tags span{font-size:14px;padding:4px 10px;background:#e7e3d8;border-radius:999px}
  .block{margin-top:36px}
  .block h2{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .work a{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;font-weight:500}
  .work a:last-child{border-bottom:1px solid var(--line)}
  .work a:hover{color:var(--hot)}
  .work a span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
  .side{border:1.5px solid var(--ink);padding:22px;border-radius:4px;background:#faf9f4}
  .side .price{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .side .price small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
  .facts{margin:18px 0;display:grid;gap:8px;font-size:14px}
  .facts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .facts span:first-child{color:var(--muted)}
  .contacts{display:grid;gap:8px}
  .contacts .btn{width:100%}
  .warn{margin-top:16px;font-size:13px;color:var(--muted)}
  .warn a{color:var(--ink)}

  /* plans */
  .page-h{padding-top:48px;padding-bottom:12px}
  .page-h h1{font-size:clamp(40px,8vw,88px);line-height:.92;letter-spacing:-.05em;font-weight:800;max-width:12ch}
  .page-h p{color:var(--muted);font-size:18px;max-width:52ch;margin-top:18px}
  .plans{display:grid;gap:12px;margin:36px 0 12px}
  @media (min-width:700px){ .plans{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1000px){ .plans{grid-template-columns:repeat(4,1fr)} }
  .plan{border:1.5px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:14px;border-radius:4px}
  .plan h3{font-size:15px;font-weight:700}
  .plan .amt{font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1}
  .plan .amt small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
  .plan ul{list-style:none;display:grid;gap:8px;font-size:15px}
  .plan li{padding-left:18px;position:relative}
  .plan li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:2px;background:currentColor}
  .plan .btn{margin-top:auto}
  .plan.ultra{background:var(--ink);color:var(--bg)}
  .plan.ultra .amt small{color:#b9b4a8}
  .plan.ultra .btn{background:var(--hot);border-color:var(--hot);color:#fff}
  .plan.ultra .btn:hover{background:var(--bg);border-color:var(--bg);color:var(--ink)}
  @media (min-width:1000px){ .plan.ultra{transform:translateY(-14px)} }
  .note{font-size:14px;color:var(--muted);max-width:70ch}

  /* paid perks */
  .open{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#15803d}
  .open i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .row .open{font-size:0;gap:0}
  .phead{padding-bottom:36px;margin-bottom:8px}
  .phead .back{color:inherit;opacity:.7}
  .phead .av{box-shadow:0 0 0 3px currentColor}
  .phead .meta,.phead .meta span{color:inherit}
  .phead .open{color:inherit}
  .prof .meta b{color:var(--ink)}
  .phead .meta b{color:inherit}
  .phead h1{font-size:clamp(36px,7vw,64px);line-height:.98;letter-spacing:-.045em;font-weight:800;margin:18px 0 14px;max-width:18ch}
  .prof[style] .side{border-color:var(--acc);box-shadow:6px 6px 0 var(--acc)}
  .prof[style] .tags span{background:transparent;border:1.5px solid var(--acc)}
  .best{display:block;text-decoration:none;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
  .best-shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:#e7e3d8}
  .best-shot iframe{position:absolute;top:0;left:0;width:250%;height:250%;border:0;transform:scale(.4);transform-origin:0 0;pointer-events:none}
  .best-cap{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1.5px solid var(--ink);background:#faf9f4}
  .best-cap span{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .best:hover .best-cap b{color:var(--hot)}
  .plan{position:relative}
  .plan .tagp{position:absolute;top:-11px;left:20px;background:var(--hot);color:#fff;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:3px}
  .plan .pm{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--muted);margin-top:-6px}
  .plan.ultra .pm{color:#b9b4a8}
  .plan.pro{box-shadow:6px 6px 0 var(--hot)}
  .compare{margin:48px 0 0;border-top:1px solid var(--ink)}
  .compare h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;line-height:1;font-weight:800;margin:28px 0 8px;max-width:20ch}

  /* apply form */
  .form{max-width:620px;display:grid;gap:18px;margin-top:24px}
  .form label{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 0;font-weight:500;font-size:15px}
  .form label > input:not([type=checkbox]),.form label > select,.form label > textarea,.form label > small{flex:0 0 100%}
  .form small{font-weight:400;color:var(--muted);font-size:13px}
  .form input:not([type=checkbox]),.form select,.form textarea{width:100%;font:400 17px/1.4 var(--sans);color:var(--ink);background:#faf9f4;border:1.5px solid var(--ink);border-radius:4px;padding:12px 14px;outline:none}
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--hot)}
  .form textarea{resize:vertical}
  .form .two{display:grid;gap:18px}
  @media (min-width:560px){ .form .two{grid-template-columns:1fr 1fr} }
  .form .check{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-start;font-weight:400}
  .form .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--hot);flex:none}
  .form .btn{justify-self:start;padding:16px 28px}
  .err{color:var(--hot);font-weight:500;min-height:1px}
  .form em{font:500 11px/1 var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
  .form .opt{color:var(--muted)}
  .form .req{color:var(--hot)}
  .form label > em{display:inline}
  .form .group{border:1.5px dashed var(--line);border-radius:4px;padding:16px;display:grid;gap:18px}
  .form .group legend{font-weight:500;font-size:15px;padding:0 6px}
  .form .lead{font-size:14px;color:var(--muted)}
  .form .lead svg{vertical-align:-4px;margin-right:4px}
  .form .lead b{color:var(--ink)}

  /* text pages */
  .text{max-width:68ch;padding-bottom:24px}
  .text h2{font-size:24px;letter-spacing:-.02em;margin:36px 0 8px}
  .text p,.text li{font-size:17px;margin-bottom:10px}
  .text ul{padding-left:20px}

  footer{margin-top:80px;border-top:1px solid var(--ink);padding:24px 0 40px}
  footer .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center}
  footer nav{margin:0;flex-wrap:wrap;gap:14px}
  footer nav a{font-size:14px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== calmer, more professional layer ===== */
  .mono,.row .cat,.row .rep,.block h2,.badge,.open,.plan .pm,.plan .tagp,.form em,.chip small,.feat .foot,.best-cap span,.work a span:last-child{font-family:var(--sans);letter-spacing:.08em}
  .mono{font-size:11px;font-weight:600}
  header{border-bottom:1px solid var(--line);background:var(--bg)}
  body,header,.row,.chip,.search,.side,.plan,.btn{transition:background-color .2s ease-out,color .2s ease-out,border-color .2s ease-out}
  .logo{font-weight:700;font-size:20px;letter-spacing:-.03em}
  .logo i{border-radius:3px;width:10px;height:10px}
  nav a{font-weight:500;color:var(--muted)}
  nav a:hover{color:var(--ink)}
  .btn{border-radius:6px;font-weight:600;border-width:1px}
  nav .btn{color:var(--bg)}
  .btn:hover{background:var(--hot);border-color:var(--hot)}
  .hero h1,.page-h h1,.prof h1,.phead h1,.band h2,.compare h2{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1}
  .hero h1{font-size:clamp(48px,9vw,104px);max-width:13ch}
  .hero h1 span{font-style:italic;color:var(--hot)}
  .page-h h1{font-size:clamp(44px,7vw,80px)}
  .prof h1,.phead h1{font-size:clamp(38px,6vw,60px)}
  .band h2,.compare h2{font-size:clamp(32px,5vw,52px)}
  .hero p{color:var(--muted);font-size:18px}
  .stats b,.side .price,.plan .amt{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
  .stats b{font-size:34px}
  .side .price{font-size:48px}
  .plan .amt{font-size:56px}
  .search{border:1px solid var(--line-2);border-radius:6px;background:var(--paper);padding:6px 16px;border-bottom-width:1px}
  .search:focus-within{border-color:var(--ink)}
  .search input{font-size:18px;font-weight:400}
  .chip{border:1px solid var(--line-2);border-radius:6px;font-weight:500;background:var(--paper)}
  .chip:hover{background:var(--bg);color:var(--ink);border-color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .sec-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .list{border-top:1px solid var(--line-2)}
  .row:hover{background:var(--paper)}
  .feat{border-radius:8px}
  .feat:hover{transform:none;background:#1b1b1b}
  .feat h3{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.01em}
  .feat .foot b{color:#8fd1b6}
  .badge{font-weight:600;border-radius:4px}
  .badge.ultra{background:var(--hot);border-color:var(--hot)}
  .side,.plan,.best{border:1px solid var(--line-2);border-radius:8px;background:var(--paper)}
  .plan.pro{box-shadow:none;border-color:var(--ink)}
  .plan.ultra{background:var(--ink);border-color:var(--ink)}
  .plan.ultra .btn{background:#fff;border-color:#fff;color:var(--ink)}
  .plan.ultra .btn:hover{background:var(--hot);border-color:var(--hot);color:#fff}
  @media (min-width:1000px){ .plan.ultra{transform:none} }
  .plan .tagp{border-radius:4px;background:var(--ink)}
  .plan h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .plan li::before{width:6px;height:6px;border-radius:50%;top:.55em;background:var(--hot)}
  .plan.ultra li::before{background:#8fd1b6}
  .prof[style] .side{box-shadow:none;border-top:4px solid var(--acc)}
  .tags span{background:transparent;border:1px solid var(--line-2);border-radius:6px}
  .prof[style] .tags span{border-width:1px}
  .best-cap{border-top:1px solid var(--line-2);background:var(--paper)}
  .work a:hover{color:var(--hot)}
  .ad{border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  .form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--line-2);border-radius:6px;background:var(--paper)}
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--ink)}
  .form .group{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.5)}
  .form .req{color:var(--hot)}
  .err{color:#b42318}
  footer{border-top:1px solid var(--line)}

</style>

<script>
// Theme switcher: visitors pick the look they like (remembered on their device)
(() => {
  const box = document.getElementById("themes"), root = document.documentElement;
  const foot = document.querySelector("footer .wrap"); if (foot) foot.appendChild(box);
  let t = "forest"; try { t = localStorage.getItem("freshhands:theme") || t; } catch (e) {}
  const set = v => {
    if (v === "forest") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", v);
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === v));
    try { localStorage.setItem("freshhands:theme", v); } catch (e) {}
  };
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (b) set(b.dataset.t); });
  set(t);
})();
</script>

<script src="data.js"></script>
<script>
(() => {
  const SITE = window.SITE || {};
  const LOCAL = (window.FREELANCERS || []).slice();
  let PEOPLE = LOCAL.slice();

  // ---------- database (Supabase) ----------
  const SB = SITE.supabase || {};
  const DB = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SB.url || "") && String(SB.key || "").length > 20;
  async function db(path, opts = {}) {
    const r = await fetch(SB.url.replace(/\/$/, "") + "/rest/v1/" + path, {
      ...opts,
      headers: { apikey: SB.key, "Content-Type": "application/json", ...(opts.headers || {}) },
    });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
    return r.status === 204 || r.headers.get("content-length") === "0" ? null : r.json().catch(() => null);
  }
  const fromRow = r => ({
    id: r.slug, name: r.name, plan: r.plan, category: r.category, title: r.title, about: r.about,
    skills: r.skills || [], languages: r.languages || [], priceFrom: r.price_from, replyIn: r.reply_in,
    portfolio: Array.isArray(r.portfolio) ? r.portfolio : [], contact: r.contact || {}, color: r.color || "",
    available: r.available, joined: String(r.created_at || "").slice(0, 10), fromDb: true, hasChat: !!r.has_chat, customCategory: r.custom_category || "",
  });
  async function loadPeople() {
    if (!DB) return;
    try {
      const rows = await db("public_profiles?select=*&order=created_at.desc&limit=1000");
      const local = new Set(LOCAL.map(p => p.id));
      PEOPLE = LOCAL.concat((rows || []).map(fromRow).filter(p => !local.has(p.id)));
    } catch (e) { console.warn("Could not load profiles", e); }
  }

  // ---------- accounts: Continue with Google (Supabase Auth, PKCE) ----------
  const AUTHK = "freshhands:auth";
  function getAuth() { try { return JSON.parse(localStorage.getItem(AUTHK) || "null"); } catch (e) { return null; } }
  function setAuth(a) { try { a ? localStorage.setItem(AUTHK, JSON.stringify(a)) : localStorage.removeItem(AUTHK); } catch (e) {} updateNav(); }
  const authBase = () => SB.url.replace(/\/$/, "") + "/auth/v1";
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  async function googleLogin() {
    if (location.protocol !== "https:") {
      const live = safeUrl(SITE.liveUrl) || "https://jenyatank.github.io/freshhands/";
      toast("Opening the live site…");
      setTimeout(() => { location.href = live + (location.hash || "#/"); }, 700);
      return;
    }
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
    const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    try { localStorage.setItem("freshhands:pkce", verifier); localStorage.setItem("freshhands:back", location.hash || "#/"); } catch (e) {}
    const redirect = location.origin + location.pathname;
    location.href = `${authBase()}/authorize?provider=google&redirect_to=${encodeURIComponent(redirect)}&code_challenge=${challenge}&code_challenge_method=s256`;
  }
  function saveSession(r) {
    const md = (r.user && r.user.user_metadata) || {};
    setAuth({ access: r.access_token, refresh: r.refresh_token, exp: Date.now() + (r.expires_in || 3600) * 1000,
      email: (r.user && r.user.email) || (getAuth() || {}).email || "", name: md.full_name || md.name || (getAuth() || {}).name || "" });
  }
  async function authToken() {

  // 1080x1920 picture for Instagram / TikTok stories
  async function storyCard(p) {
    await document.fonts.ready;
    const W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    const bg = userColor(p) || "#141414", fg = onColor(bg);
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    const F = (w, s) => w >= 800 ? `400 ${s}px "Instrument Serif", serif` : `${w} ${s}px "Instrument Sans", sans-serif`;
    const M = s => `600 ${s}px "Instrument Sans", sans-serif`;
    x.fillStyle = fg; x.textBaseline = "alphabetic";
    x.font = F(800, 52); x.fillText((SITE.name || "freshhands"), 90, 160);
    x.fillStyle = fg; x.fillRect(60, 132, 18, 18);
    // avatar
    const ac = userColor(p) ? fg : color(p.id || p.name);
    x.fillStyle = ac; x.beginPath(); x.arc(170, 520, 110, 0, Math.PI * 2); x.fill();
    x.fillStyle = ac === "#ffffff" ? bg : "#ffffff";
    x.font = F(800, 96); x.textAlign = "center"; x.fillText(initials(p.name), 170, 553); x.textAlign = "left";
    x.fillStyle = fg; x.font = F(700, 60); x.fillText(p.name, 90, 740);
    x.font = M(30); x.globalAlpha = .7; x.fillText(`${catLabel(p).toUpperCase()}  ·${plan(p).toUpperCase()}`, 90, 800); x.globalAlpha = 1;
    // title, wrapped
    x.font = F(800, 110);
    const words = String(p.title).split(/\s+/); let line = "", y = 1000; const lines = [];
    for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > W - 180 && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    lines.slice(0, 5).forEach((l, i) => x.fillText(l, 90, y + i * 112));
    y += Math.min(lines.length, 5) * 112 + 60;
    x.font = F(800, 90); x.fillText(`from €${p.priceFrom}`, 90, y + 40);
    if (HAS.open(p)) { x.fillStyle = "#22c55e"; x.beginPath(); x.arc(108, y + 120, 16, 0, Math.PI * 2); x.fill(); x.fillStyle = fg; x.font = M(36); x.fillText("AVAILABLE FOR WORK", 140, y + 133); }
    // footer
    x.fillStyle = fg; x.globalAlpha = .25; x.fillRect(90, H - 260, W - 180, 3); x.globalAlpha = 1;
    x.font = M(34); x.fillText("HIRE ME →", 90, H - 180);
    const link = location.protocol.startsWith("http") ? (location.host + location.pathname).replace(/index\.html$/, "").replace(/\/$/, "") + "/#/p/" + p.id : "";
    x.font = F(700, 46); x.fillText(link.length < 44 ? link : (SITE.name || "freshhands"), 90, H - 110);
    c.toBlob(async blob => {
      const file = new File([blob], `${p.id}-story.png`, { type: "image/png" });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e.name === "AbortError") return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Story card saved");
    }, "image/png");
    fillAds();
  }

  // ---------- router ----------
  // ================= CHAT =================
  const rpc = (fn, args) => db("rpc/" + fn, { method: "POST", body: JSON.stringify(args) });
  const THREADS = "freshhands:threads";
  function myThreads() { try { return JSON.parse(localStorage.getItem(THREADS) || "[]"); } catch (e) { return []; } }
  function saveThread(t) {
    const list = myThreads().filter(x => x.id !== t.id); list.unshift({ ...myThreads().find(x => x.id === t.id), ...t });
    try { localStorage.setItem(THREADS, JSON.stringify(list.slice(0, 100))); } catch (e) {}
    updateNav();
  }
  const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const fmtTime = s => { const d = new Date(s), now = new Date(); const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + t; };
  const errText = e => { const m = String(e && e.message || e).match(/"message":"([^"]+)"/); return m ? m[1] : "Something went wrong. Try again."; };
  let chatTimer = null;

  function startChat(p) {
    const old = myThreads().find(t => t.slug === p.id && t.role === "client");
    if (old) { location.hash = "#/chat/" + old.id; return; }
    const m = modal(`
      <h3>Message ${esc(p.name)}</h3>
      <p>Say what you need, your deadline and budget. ${esc(p.name)} will reply here.</p>
      <form class="form" id="startForm" style="margin-top:0">
        <label>Your name<input name="name" required maxlength="40" autocomplete="nickname"></label>
        <label>Message<textarea name="body" rows="4" required maxlength="2000" placeholder="Hi! I need a logo for my YouTube channel by Friday. Budget about €15."></textarea></label>
        <p class="err" id="startErr"></p>
        <div class="modal-actions"><button class="btn hot" type="submit">Send</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
      </form>`);
    m.querySelector("#startForm").addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, name = f.name.value.trim(), body = f.body.value.trim(), btn = f.querySelector("[type=submit]");
      if (!name || !body) { m.querySelector("#startErr").textContent = "Write your name and a message."; return; }
      if (!isClean(name, body)) { m.querySelector("#startErr").textContent = CLEAN_MSG; return; }
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const r = await rpc("chat_start", { p_slug: p.id, p_name: name, p_body: body });
        saveThread({ id: r.id, token: r.token, slug: p.id, with: p.name, role: "client", at: new Date().toISOString() });
        if (getAuth()) arpc("acct_save_thread", { p_thread: r.id, p_token: r.token }).catch(() => {});
        m.remove(); location.hash = "#/chat/" + r.id;
      } catch (x) { btn.disabled = false; btn.textContent = "Send"; m.querySelector("#startErr").textContent = errText(x); }
    });
  }

  function chatToken(id, fromUrl) {
    if (fromUrl) return fromUrl;
    const t = myThreads().find(x => x.id === id);
    return t ? t.token : getToken();
  }

  async function chatPage(id, urlToken) {
    if (!DB) { app.innerHTML = `<section class="wrap page-h"><h1>Chat is off.</h1></section>`; return; }
    const token = chatToken(id, urlToken);
    const S = { id, token, after: 0, msgs: [], dels: [], previews: {}, role: "", info: null, reply: null, selecting: false, selected: new Set() };
    app.innerHTML = `
      <section class="wrap chat">
        <a class="back" href="#/inbox">← My chats</a>
        <div class="chat-head" id="chatHead"><p class="note">Loading…</p></div>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <div class="chat-bar">
          <div class="selbar hidden" id="selBar"><span id="selCount">0 selected</span><button class="btn ghost" id="selCopy" type="button">Copy</button><button class="btn danger" id="selDel" type="button">Delete</button><button class="btn ghost" id="selCancel" type="button">Cancel</button></div>
          <div class="replybar hidden" id="replyBar"><div><b>Reply</b><span id="replyText"></span></div><button type="button" id="replyX" aria-label="Cancel reply">×</button></div>
          <div class="chat-tools">
            <button class="btn ghost" id="attBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L15 7.5"/></svg>Send file to view</button>
            <button class="btn ghost hidden" id="upBtn" type="button">Upload work</button>
          </div>
          <form class="chat-form" id="chatForm">
            <textarea id="chatIn" rows="1" maxlength="2000" placeholder="Write a message…" aria-label="Message"></textarea>
            <button class="btn hot" type="submit">Send</button>
          </form>
        </div>
      </section>`;
    const log = document.getElementById("chatLog"), input = document.getElementById("chatIn");

    async function load(first) {
      let r;
      try { r = await rpc("chat_get", { p_thread: id, p_token: token, p_after: 0 }); }
      catch (e) {
        if (first) app.innerHTML = `<section class="wrap page-h"><h1>Can't open this chat.</h1><p>This chat link doesn't work on this device. Ask the other person to send you the chat link again.</p></section>`;
        return;
      }
      if (first) {
        S.role = r.role; S.info = r;
        if (r.role === "client") saveThread({ id, token, slug: r.slug, with: r.freelancer, role: "client" });
        const other = r.role === "client" ? r.freelancer : r.client_name;
        document.getElementById("chatHead").innerHTML = `
          <div><h1>${esc(other)}</h1><p class="note">${r.role === "client" ? esc(r.title) : "Client · chat about your service"}</p></div>
          ${r.role === "client" ? `<button class="btn ghost" id="copyLink" type="button">Copy chat link</button>` : `<a class="btn ghost" href="#/p/${encodeURIComponent(r.slug)}">My profile</a>`}`;
        const cl = document.getElementById("copyLink");
        if (cl) cl.addEventListener("click", async () => {
          const link = location.href.split("#")[0] + "#/chat/" + id + "/" + token;
          try { await navigator.clipboard.writeText(link); toast("Link copied. Keep it private: anyone with it can read this chat."); } catch (e) { prompt("Copy this link:", link); }
        });
        if (r.role === "freelancer") { const ub = document.getElementById("upBtn"); ub.classList.remove("hidden"); ub.addEventListener("click", () => deliverDialog(S, () => load(false))); }
        document.getElementById("attBtn").addEventListener("click", () => attachDialog(S, () => load(false)));
      }
      let changed = false;
      if (JSON.stringify(r.messages) !== JSON.stringify(S.msgs)) { S.msgs = r.messages; changed = true; }
      if (JSON.stringify(r.deliveries) !== JSON.stringify(S.dels)) { S.dels = r.deliveries; changed = true; }
      for (const d of S.dels) if (d.has_preview && !(d.id in S.previews)) {
        S.previews[d.id] = null;
        rpc("chat_preview", { p_thread: id, p_token: token, p_delivery: d.id }).then(src => { S.previews[d.id] = src; draw(); }).catch(() => {});
      }
      if (changed) draw();
    }

    function deliveryCard(d) {
      const prev = S.previews[d.id];
      if (d.kind === "view") {
        const isVid = String(d.mime).startsWith("video/");
        const fromMe = d.sender === S.role;
        const who = fromMe ? "You" : (d.sender === "client" ? S.info.client_name : S.info.freelancer);
        return `<div class="dcard viewonly ${fromMe ? "mine" : ""}">
          <div class="dshot guarded" data-view="${d.id}" title="Click to view">${prev ? `<img src="${esc(prev)}" alt="" draggable="false">` : `<span>${isVid ? "VIDEO" : "IMAGE"}</span>`}
            <i class="lock">View only</i></div>
          <div class="dbody"><b translate="no">${esc(d.name)}</b><span class="note">${esc(who)} · ${fmtSize(d.size)} · can't be downloaded</span>
            <button class="btn ghost" data-view="${d.id}">${isVid ? "Play" : "View"}</button></div>
        </div>`;
      }
      const ext = (d.name.split(".").pop() || "file").slice(0, 5).toUpperCase();
      const price = "€" + Number(d.price).toFixed(Number(d.price) % 1 ? 2 : 0);
      let actions = "";
      if (S.role === "client") {
        if (d.status === "unlocked") actions = `<button class="btn hot" data-dl="${d.id}">Download</button>`;
        else if (d.pay_clicked) actions = `<p class="note">Waiting for ${esc(S.info.freelancer)} to confirm your payment. The download unlocks right after.</p>${d.pay_link ? `<button class="btn ghost" data-pay="${d.id}">Open payment link again</button>` : ""}`;
        else actions = d.pay_link ? `<button class="btn hot" data-pay="${d.id}">Pay ${price}</button>` : `<p class="note">Ask ${esc(S.info.freelancer)} how to pay.</p>`;
      } else {
        actions = d.status === "unlocked" ? `<p class="note">Unlocked. The client can download it.</p>`
          : `${d.pay_clicked ? `<p class="note"><b>The client went to pay.</b> Check that the money arrived, then unlock.</p>` : `<p class="note">Waiting for the client to pay.</p>`}<button class="btn hot" data-unlock="${d.id}">Payment received — unlock</button>`;
        actions += `<button class="btn ghost" data-dl="${d.id}">Download my file</button>`;
      }
      return `<div class="dcard ${d.status}">
        <div class="dshot${prev ? " guarded" : ""}"${prev ? ` data-view="${d.id}" title="Click to view"` : ""}>${prev ? `<img src="${esc(prev)}" alt="Preview of ${esc(d.name)}" draggable="false">` : `<span>${esc(ext)}</span>`}
          ${d.status === "locked" ? `<i class="lock">Locked</i>` : `<i class="lock open">Unlocked</i>`}</div>
        <div class="dbody"><b>${esc(d.name)}</b><span class="note">${fmtSize(d.size)} · ${price}</span>${actions}</div>
      </div>`;
    }

    function draw() {
      const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
      const byId = Object.fromEntries(S.msgs.map(m => [m.id, m]));
      const msgHtml = m => {
        if (m.sender === "system") return `<div class="msg sys">${esc(m.body)}<time>${fmtTime(m.at)}</time></div>`;
        const q = m.reply_to && byId[m.reply_to];
        const quote = q ? `<div class="quote" data-jump="${q.id}"><b>${q.sender === S.role ? "You" : esc(q.sender === "client" ? S.info.client_name : S.info.freelancer)}</b>${q.deleted ? "<i>Deleted message</i>" : esc(q.body.slice(0, 120))}</div>` : "";
        const sel = S.selecting ? `<input type="checkbox" class="pick" ${S.selected.has(m.id) ? "checked" : ""} aria-label="Select message">` : "";
        return `<div class="msg ${m.sender === S.role ? "me" : "them"}${m.deleted ? " gone" : ""}${S.selected.has(m.id) ? " picked" : ""}" data-mid="${m.id}" id="m${m.id}">${sel}${quote}
          <p>${m.deleted ? "<i>Message deleted</i>" : esc(m.body).replace(/\n/g, "<br>")}</p><time>${fmtTime(m.at)}${m.edited && !m.deleted ? " · edited" : ""}</time></div>`;
      };
      const items = S.msgs.map(m => ({ at: m.at, html: msgHtml(m) }))
        .concat(S.dels.map(d => ({ at: d.at, html: deliveryCard(d) })))
        .sort((a, b) => new Date(a.at) - new Date(b.at));
      log.innerHTML = items.map(i => i.html).join("") || `<p class="note">No messages yet.</p>`;
      if (near || !draw.done) { log.scrollTop = log.scrollHeight; draw.done = true; }
    }
    draw.done = false;

    log.addEventListener("click", async e => {
      const view = e.target.closest("[data-view]");
      const vd = view && S.dels.find(x => x.id === view.dataset.view);
      if (vd && vd.kind === "view" && String(vd.mime).startsWith("video/")) {
        const me = S.role === "client" ? S.info.client_name : S.info.freelancer;
        const md = modal(`<div class="viewer guarded vid"><p class="note" style="padding:40px;text-align:center">Loading…</p></div>
          <p class="note" style="margin:12px 0">View only. It can't be downloaded.</p>
          <div class="modal-actions"><button class="btn ghost" data-close>Close</button></div>`);
        md.querySelector(".modal-box").classList.add("wide");
        try {
          const f = await rpc("chat_media", { p_thread: id, p_token: token, p_delivery: vd.id });
          const bin = atob(f.data), arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const url = URL.createObjectURL(new Blob([arr], { type: f.mime }));
          const box = md.querySelector(".viewer");
          box.innerHTML = `<video src="${url}" controls playsinline controlsList="nodownload noplaybackrate noremoteplayback" disablePictureInPicture disableRemotePlayback></video>
            <div class="wm" aria-hidden="true">${Array(18).fill(`<span>freshhands · ${esc(me)}</span>`).join("")}</div>`;
          const obs = new MutationObserver(() => { if (!document.body.contains(md)) { URL.revokeObjectURL(url); obs.disconnect(); } });
          obs.observe(document.body, { childList: true });
        } catch (x) { md.querySelector(".viewer").innerHTML = `<p class="note" style="padding:40px;text-align:center">Couldn't load the video.</p>`; }
        return;
      }
      if (view && S.previews[view.dataset.view]) {

        return;
      }
      const pay = e.target.closest("[data-pay]"), un = e.target.closest("[data-unlock]"), dl = e.target.closest("[data-dl]");
      if (pay) payDialog(S, S.dels.find(d => d.id === pay.dataset.pay), () => load(false));
      if (un) {
        if (!confirm("Did the money really arrive? After unlocking, the client can download the file.")) return;
        un.disabled = true;
        try { await rpc("chat_unlock", { p_thread: id, p_token: token, p_delivery: un.dataset.unlock }); await load(false); toast("Unlocked"); }
        catch (x) { un.disabled = false; toast(errText(x)); }
      }
      if (dl) {
        dl.disabled = true; const old = dl.textContent; dl.textContent = "Downloading…";
        try {
          const f = await rpc("chat_download", { p_thread: id, p_token: token, p_delivery: dl.dataset.dl });
          if (!f) throw new Error("locked");
          const bin = atob(f.data), arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([arr], { type: f.mime || "application/octet-stream" }));
          a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        } catch (x) { toast("Couldn't download."); }
        dl.disabled = false; dl.textContent = old;
      }

    document.getElementById("chatForm").addEventListener("submit", async e => {

    function openMenu(m, x, y) {
      closeMenu();
      const items = [
        !m.deleted && ["reply", "Reply"],
        ["info", "Info"],
        !m.deleted && mine(m) && ["edit", "Edit"],
        !m.deleted && ["copy", "Copy"],
        !m.deleted && mine(m) && ["delete", "Delete"],

    async function removeMsgs(ids) {
      const own = ids.filter(i => { const m = S.msgs.find(x => x.id === i); return m && mine(m) && !m.deleted; });

    log.addEventListener("contextmenu", e => { const m = msgOf(e.target); if (!m || S.selecting) return; e.preventDefault(); openMenu(m, e.clientX, e.clientY); });

  // ----- make previews hard to copy: blur when the window loses focus or on PrintScreen -----
  (() => {
    let t = null;
    const shield = ms => { document.body.classList.add("shielded"); clearTimeout(t); if (ms) t = setTimeout(() => document.body.classList.remove("shielded"), ms); };
    const unshield = () => { clearTimeout(t); t = setTimeout(() => document.body.classList.remove("shielded"), 250); };
    window.addEventListener("blur", () => shield(0));
    window.addEventListener("focus", unshield);
    document.addEventListener("visibilitychange", () => document.hidden ? shield(0) : unshield());
    const isShot = e => e.key === "PrintScreen" || ((e.metaKey || e.ctrlKey) && e.shiftKey && /^[345s]$/i.test(e.key));
    document.addEventListener("keydown", e => {
      if (isShot(e)) shield(2500);
      if ((e.ctrlKey || e.metaKey) && /^[ps]$/i.test(e.key) && document.querySelector(".guarded")) { e.preventDefault(); toast("Saving and printing previews is off."); }
    });
    document.addEventListener("keyup", e => {
      if (e.key === "PrintScreen") { shield(2500); try { navigator.clipboard.writeText("Previews on freshhands are protected."); } catch (x) {} }
    });
    document.addEventListener("contextmenu", e => { if (e.target.closest(".guarded")) e.preventDefault(); });
    document.addEventListener("dragstart", e => { if (e.target.closest(".guarded")) e.preventDefault(); });
  })();

  // Small preview with a strong watermark so it can't be used instead of the real file
  async function watermark(file, opt = {}) {
    const text = opt.text || "freshhands preview";
    try {
      const img = await createImageBitmap(file);
      const s = Math.min(1, (opt.max || 720) / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
      x.save(); x.translate(c.width / 2, c.height / 2); x.rotate(-Math.PI / 6);
      x.font = `600 ${Math.max(16, Math.round(c.width / (opt.text ? 26 : 16)))}px "Instrument Sans", sans-serif`; x.textAlign = "center";
      const step = Math.max(40, Math.round(c.width / 7));
      const gap = x.measureText(text).width + step;
      for (let yy = -c.height; yy < c.height; yy += step) for (let xx = -c.width; xx < c.width; xx += gap) {
        x.fillStyle = "rgba(255,255,255,.5)"; x.fillText(text, xx, yy);
        x.fillStyle = "rgba(0,0,0,.25)"; x.fillText(text, xx + 1, yy + 1);
      }
      x.restore();
      return c.toDataURL("image/jpeg", opt.quality || 0.55);
    } catch (e) { return null; }
  }

      <h3>Log out?</h3>
      <p>This profile was made before deleting was possible, so it can't be removed from here. Ask us by email to remove it.</p>
      <div class="modal-actions">
        <button class="btn" data-act="out">Log out</button>
        <button class="btn ghost" data-close>Cancel</button>
      </div>`);
    m.addEventListener("click", async e => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      if (b.dataset.act === "out") { setMine(""); m.remove(); toast("Logged out"); location.hash = "#/"; return; }
      b.disabled = true; b.textContent = "Deleting…";
      try {
        if (await deleteMine()) { m.remove(); toast("Profile deleted"); location.hash = "#/"; route(); }
        else { b.disabled = false; b.textContent = "Log out and delete my profile"; toast("Couldn't delete. Try again."); }
      } catch (x) { b.disabled = false; b.textContent = "Log out and delete my profile"; toast("Couldn't delete. Try again."); }
    });
  }
  function updateNav() {
    const mine = getMine(), j = document.getElementById("navJoin"), o = document.getElementById("navOut");
    if (mine) { j.textContent = "My profile"; j.href = "#/p/" + encodeURIComponent(mine); o.classList.remove("hidden"); }
    else { j.textContent = "Join"; j.href = "#/plans"; o.classList.add("hidden"); }
    document.getElementById("navMsg").classList.toggle("hidden", !(DB && (mine || myThreads().length)));
    const signed = !!getAuth();
    document.getElementById("navIn").classList.toggle("hidden", !DB || signed || !!mine);
    if (signed) o.classList.remove("hidden");
  }
  document.getElementById("navOut").addEventListener("click", logoutDialog);
  // phone menu open / close
  const hdr = document.querySelector("header"), menuBtn = document.getElementById("menuBtn");
  const setMenu = on => { hdr.classList.toggle("menu-open", on); menuBtn.setAttribute("aria-expanded", on); };
  menuBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(!hdr.classList.contains("menu-open")); });
  document.getElementById("mainNav").addEventListener("click", e => { if (e.target.closest("a,button")) setMenu(false); });
  document.addEventListener("click", e => { if (!e.target.closest("header")) setMenu(false); });
  window.addEventListener("hashchange", () => setMenu(false));
  document.getElementById("navIn").addEventListener("click", loginDialog);
  updateNav();

  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [page, arg] = h.split("/");
    if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
    updateNav();
    if (page === "chat" && arg) { chatPage(decodeURIComponent(arg), h.split("/")[2] || ""); window.scrollTo(0, 0); return; }
    if (page === "inbox") { inboxPage(); window.scrollTo(0, 0); return; }
    if (page === "settings") { settingsPage(); window.scrollTo(0, 0); return; }
    if (page === "me" && arg) { setMine(decodeURIComponent(arg)); location.replace("#/p/" + arg); return; }
    if (page === "p" && arg) profile(decodeURIComponent(arg));
    else if (page === "plans") plans();
    else if (page === "apply") apply();
    else if (page === "safety") safety();
    else if (page === "terms") terms();
    else home();
    if (page !== "" || !route.first) window.scrollTo(0, 0);
    route.first = true;
  }
  window.addEventListener("hashchange", route);
  if (DB) {
    app.innerHTML = `<section class="wrap page-h"><p>Loading…</p></section>`;
    authInit().catch(e => console.warn(e)).then(loadPeople).then(route);
  } else route();
})();
</script>
